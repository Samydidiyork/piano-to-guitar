<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano → Guitare · Prototype</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8f8f6; color: #1a1a1a; padding: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 0.85rem; color: #666; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .card { background: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 1rem 1.25rem; }
    .card-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 0.75rem; }
    .note-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .note-btn { padding: 4px 9px; font-size: 0.8rem; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; cursor: pointer; transition: all 0.1s; }
    .note-btn.active-rh { background: #0F6E56; border-color: #0F6E56; color: white; }
    .note-btn.active-lh { background: #185FA5; border-color: #185FA5; color: white; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
    .btn { padding: 7px 14px; font-size: 0.82rem; border: 1px solid #ddd; border-radius: 7px; background: white; cursor: pointer; }
    .btn.primary { background: #1a1a1a; border-color: #1a1a1a; color: white; }
    .btn:hover { opacity: 0.85; }
    .result { background: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 1rem 1.25rem; display: none; }
    .tab-display { font-family: monospace; font-size: 0.9rem; line-height: 2; background: #f5f5f3; border-radius: 7px; padding: 1rem; margin-top: 0.75rem; }
    .tab-line { display: flex; gap: 2px; }
    .s-name { color: #888; min-width: 28px; font-weight: 600; }
    .fret-on { color: #0F6E56; font-weight: 700; }
    .pill { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 20px; margin: 2px; }
    .pill-kept { background: #e6f4ef; color: #0F6E56; }
    .pill-drop { background: #fdecea; color: #b91c1c; text-decoration: line-through; }
    .warning { font-size: 0.78rem; color: #92400e; background: #fef3c7; padding: 5px 10px; border-radius: 6px; margin-top: 8px; display: none; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Piano → Guitare</h1>
  <p class="sub">Prototype de réduction harmonique · Plugin MuseScore <a href="https://github.com/Samydidiyork/piano-to-guitar" target="_blank">github.com/Samydidiyork/piano-to-guitar</a></p>

  <div class="grid">
    <div class="card">
      <div class="card-title">🎹 Main droite — Clef de Sol</div>
      <div class="note-grid" id="rh-notes"></div>
    </div>
    <div class="card">
      <div class="card-title">🎹 Main gauche — Clef de Fa</div>
      <div class="note-grid" id="lh-notes"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" onclick="generate()">Générer la tablature ↗</button>
    <button class="btn" onclick="loadExample('Cmaj7')">Cmaj7</button>
    <button class="btn" onclick="loadExample('G9')">G9</button>
    <button class="btn" onclick="loadExample('Dm9')">Dm9</button>
    <button class="btn" onclick="reset()">Réinitialiser</button>
  </div>

  <div class="result" id="result">
    <div class="card-title">🎸 Tablature guitare générée</div>
    <div id="analysis"></div>
    <div class="tab-display" id="tab-out"></div>
    <div class="warning" id="oct-warn">⚠ Mélodie remontée d'une octave (chevauchement basse/mélodie détecté)</div>
  </div>

  <script>
    const NOTES = ['Do','Do#','Ré','Ré#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
    const STRING_TUNING = [40,45,50,55,59,64];
    const STRING_NAMES  = ['E²','A²','D³','G³','B³','E⁴'];
    const SACRIFICE     = new Set([7, 2, 14]);
    const MAX_NOTES     = 6;

    const RH_RANGE = [
      {n:'Mi',o:4,m:64},{n:'Fa',o:4,m:65},{n:'Fa#',o:4,m:66},{n:'Sol',o:4,m:67},
      {n:'Sol#',o:4,m:68},{n:'La',o:4,m:69},{n:'La#',o:4,m:70},{n:'Si',o:4,m:71},
      {n:'Do',o:5,m:72},{n:'Do#',o:5,m:73},{n:'Ré',o:5,m:74},{n:'Ré#',o:5,m:75},
      {n:'Mi',o:5,m:76},{n:'Fa',o:5,m:77},{n:'Sol',o:5,m:79}
    ];
    const LH_RANGE = [
      {n:'Do',o:2,m:36},{n:'Ré',o:2,m:38},{n:'Mi',o:2,m:40},{n:'Fa',o:2,m:41},
      {n:'Sol',o:2,m:43},{n:'La',o:2,m:45},{n:'Si',o:2,m:47},
      {n:'Do',o:3,m:48},{n:'Ré',o:3,m:50},{n:'Mi',o:3,m:52},{n:'Fa',o:3,m:53},
      {n:'Sol',o:3,m:55},{n:'La',o:3,m:57},{n:'Si',o:3,m:59},
      {n:'Do',o:4,m:60},{n:'Mi',o:4,m:64}
    ];

    const EXAMPLES = {
      Cmaj7: { rh:[72,74,76], lh:[48,52,55,59] },
      G9:    { rh:[74,76,79], lh:[43,47,50,53,57] },
      Dm9:   { rh:[72,74,77], lh:[38,41,45,48,52] }
    };

    let rhSel = new Set(), lhSel = new Set();

    function buildGrid(id, range, sel, cls) {
      const el = document.getElementById(id);
      el.innerHTML = '';
      range.forEach(({n,o,m}) => {
        const b = document.createElement('button');
        b.className = 'note-btn' + (sel.has(m) ? ` ${cls}` : '');
        b.textContent = `${n}${o}`;
        b.onclick = () => { sel.has(m) ? sel.delete(m) : sel.add(m); buildGrid(id,range,sel,cls); };
        el.appendChild(b);
      });
    }

    function loadExample(name) {
      const ex = EXAMPLES[name];
      rhSel = new Set(ex.rh); lhSel = new Set(ex.lh);
      buildGrid('rh-notes', RH_RANGE, rhSel, 'active-rh');
      buildGrid('lh-notes', LH_RANGE, lhSel, 'active-lh');
    }

    function reset() {
      rhSel = new Set(); lhSel = new Set();
      buildGrid('rh-notes', RH_RANGE, rhSel, 'active-rh');
      buildGrid('lh-notes', LH_RANGE, lhSel, 'active-lh');
      document.getElementById('result').style.display = 'none';
    }

    function intervalLabel(i) {
      return ({0:'fond.',1:'♭2',2:'9e',3:'3e min',4:'3e maj',5:'4e',6:'♭5',7:'5e',8:'5e+',9:'6e',10:'7e min',11:'7e maj'})[i] || '?';
    }

    function generate() {
      const allMidi = [...rhSel, ...lhSel];
      if (!allMidi.length) return;

      const bass   = Math.min(...(lhSel.size ? [...lhSel] : [...rhSel]));
      let   melody = Math.max(...(rhSel.size ? [...rhSel] : [...lhSel]));
      const bassPC = bass % 12;

      const seenPC = new Set(), pool = [];
      [...allMidi].sort((a,b)=>a-b).forEach(m => {
        const pc = m % 12;
        if (!seenPC.has(pc)) {
          seenPC.add(pc);
          pool.push({ midi:m, pc, interval:((pc-bassPC)+12)%12, name:NOTES[pc] });
        }
      });

      let octaveShifted = false;
      if (melody <= bass + 5) { melody += 12; octaveShifted = true; }

      const kept = [], dropped = [];
      pool.forEach(n => {
        const isBass   = n.midi === bass;
        const isMelody = n.midi === melody || (octaveShifted && n.midi === melody - 12);
        if (SACRIFICE.has(n.interval) && !isBass && !isMelody) {
          dropped.push({ ...n, reason: intervalLabel(n.interval) });
        } else {
          kept.push({ midi: isMelody && octaveShifted ? n.midi+12 : n.midi,
                      isBass, isMelody, interval: n.interval, name: n.name });
        }
      });

      if (kept.length > MAX_NOTES) {
        const ess   = kept.filter(n => n.isBass || n.isMelody);
        const extra = kept.filter(n => !n.isBass && !n.isMelody);
        const slots = MAX_NOTES - ess.length;
        extra.slice(slots).forEach(n => dropped.push({...n, reason:'surcharge'}));
        kept.length = 0; ess.concat(extra.slice(0,slots)).forEach(n => kept.push(n));
      }
      kept.sort((a,b)=>a.midi-b.midi);

      // Assign strings
      const usedStr = new Set(), tabNotes = [];
      kept.forEach(n => {
        if (n.midi < 40 || n.midi > 76) return;
        let bestS = -1, bestF = 999;
        for (let s = 0; s < 6; s++) {
          if (usedStr.has(s)) continue;
          const f = n.midi - STRING_TUNING[s];
          if (f >= 0 && f <= 12 && f < bestF) { bestS = s; bestF = f; }
        }
        if (bestS !== -1) { usedStr.add(bestS); tabNotes.push({...n, str:bestS, fret:bestF}); }
      });

      // Render
      const analysisEl = document.getElementById('analysis');
      analysisEl.innerHTML =
        '<div style="margin-bottom:6px;font-size:0.78rem;color:#888">Conservées :</div>' +
        kept.map(n => `<span class="pill pill-kept">${n.name}${n.isBass?' 🔉':''}${n.isMelody?' ♪':''} <small>${intervalLabel(n.interval)}</small></span>`).join('') +
        (dropped.length ? '<div style="margin:8px 0 4px;font-size:0.78rem;color:#888">Sacrifiées :</div>' +
          dropped.map(n => `<span class="pill pill-drop">${n.name} <small>${n.reason}</small></span>`).join('') : '');

      const tabEl = document.getElementById('tab-out');
      tabEl.innerHTML = STRING_NAMES.map((sn, si) => {
        const tn = tabNotes.find(n => n.str === si);
        return `<div class="tab-line"><span class="s-name">${sn}</span><span>|--</span><span class="${tn ? 'fret-on' : ''}">${tn ? String(tn.fret).padEnd(3,'-') : '---'}</span><span>|</span></div>`;
      }).join('');

      document.getElementById('oct-warn').style.display = octaveShifted ? 'block' : 'none';
      document.getElementById('result').style.display = 'block';
    }

    // Init
    buildGrid('rh-notes', RH_RANGE, rhSel, 'active-rh');
    buildGrid('lh-notes', LH_RANGE, lhSel, 'active-lh');
  </script>
</body>
</html>
